[package]
name = "collector_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.7", features = ["macros", "ws"] }
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.31"
hex = "0.4.3"
lapin = "3.7.2"
reqwest = { version = "0.12.25", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sodiumoxide = "0.2.7"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors", "limit"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
urlencoding = "2.1.3"
